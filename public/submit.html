<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeEval AI</title><link rel="stylesheet" href="style.css"></head><body data-page="submit"><header><h1>CodeEval <span>AI</span></h1><nav><a href="index.html" class="">Dashboard</a><a href="failures.html" class="">Failure analysis</a><a href="submit.html" class="on">Submit response</a></nav></header><main><div id="banner"></div>
<div class="card" style="margin-bottom:16px"><h2>Manual model response evaluation</h2>
<div class="row"><div><label>Task</label><select id="task" style="width:100%"></select></div><div><label>Model name</label><input id="mname" placeholder="e.g. my-model"></div><div><label>Model version</label><input id="mver"></div><div><label>Run #</label><input id="run" type="number" value="1" min="1"></div></div>
<div id="taskinfo"></div><label>Model's Python answer</label><textarea id="code" spellcheck="false" placeholder="Paste the code returned by the model"></textarea>
<div class="row"><div><label>Manual complexity score override (0-10, optional)</label><input id="mc" type="number" min="0" max="10" step="0.5"></div></div><p><button id="go">Evaluate</button></p>
<p style="color:var(--mute);font-size:12px">Submitted code is executed on this machine. Only paste code you are willing to run.</p></div><div id="result"></div></main><script src="app.js"></script></body></html>
